services:
  peopleforce:
    image: peopleforce
    build:
      context: .
      dockerfile: PeopleForce.Api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=peopleforce;Username=postgres;Password=passpass"
      Config__Keycloak__BaseUrl: "http://host.docker.internal:8080"
    depends_on:
      - postgres

    develop:
      watch:
        - action: rebuild
          path: .

  postgres:
    image: postgres:17
    container_name: peopleforce-postgres
    environment:
      POSTGRES_DB: peopleforce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: